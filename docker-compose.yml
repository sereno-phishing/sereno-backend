# Local services of the backend: PostgreSQL holds the relational data and
# Redis the verdict cache; a plain "docker compose up" starts these two. The
# evaluation server runs on the host (start.ps1) or, with the "server"
# profile, in a third container. Every port is published on the loopback
# interface only. Credentials are development-only; override them in a
# Git-ignored .env file (variables and defaults in the README), never reuse them
# elsewhere.
name: sereno

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sereno}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sereno}
      POSTGRES_DB: ${POSTGRES_DB:-sereno}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    # The cache is disposable: no snapshots, no append-only file, no volume.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # docker compose --profile server up -d --build --wait
  server:
    profiles: ["server"]
    build:
      context: .
      # The sereno_model package and the trained artifact live in the sibling
      # repository; the Dockerfile copies them from this named context.
      additional_contexts:
        model: ../sereno-model
    environment:
      CLASSIFIER: model
      DATABASE_URL: postgresql://${POSTGRES_USER:-sereno}:${POSTGRES_PASSWORD:-sereno}@postgres:5432/${POSTGRES_DB:-sereno}
      REDIS_URL: redis://redis:6379/0
      # "0" serves every verdict from the model, without cache (README,
      # response-time experiment); on otherwise.
      CACHE_ENABLED: ${CACHE_ENABLED:-1}
    # The only address the browser extension may call.
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Answers once the model is loaded.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/v1/model', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
      start_interval: 2s
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres-data:
